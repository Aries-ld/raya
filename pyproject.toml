[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "raya-maas"
version = "0.1.0"
description = "Multimodal decision MaaS with a Jev-shaped System One protocol"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.135,<0.142", "uvicorn[standard]>=0.41,<0.55",
  "pydantic-settings>=2.12,<3", "httpx>=0.28,<0.29",
  "torch==2.10.0", "torchvision==0.25.0", "transformers==5.17.0",
  "huggingface-hub>=1.0,<2", "pillow>=12.1,<13", "av>=18.1,<19",
]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "pytest-asyncio>=1,<2", "ruff>=0.15,<0.17"]

[project.urls]
Repository = "https://github.com/Aries-ld/raya"
Documentation = "https://github.com/Aries-ld/raya/blob/main/docs/api.md"
Model = "https://huggingface.co/yuyu199741/raya-decision-v1"

[project.scripts]
raya-serve = "raya_maas.cli:serve"
raya-download = "raya_maas.download:main"

[tool.hatch.build.targets.wheel]
packages = ["raya_maas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
